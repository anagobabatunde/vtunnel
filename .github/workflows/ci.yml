name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup V
        uses: vlang/setup-v@v1.4
        with:
          check-latest: true

      - name: Check formatting
        run: v fmt -verify .

      - name: Static analysis
        run: |
          v vet src/auth/
          v vet src/config/
          v vet src/protocol/
          v vet src/proxy/
          v vet src/slog/
          v vet src/transport/
          v vet src/tunnel/
          v vet src/acme/
          v vet cmd/server/
          v vet cmd/client/
          # Note: src/hosted/ and cmd/vtunnel/ use db.sqlite which triggers
          # a V compiler bug in vet (v.ast.UnknownTypeInfo cast panic).
          # Vet these when the V compiler fix lands.

      - name: Build unified binary
        run: v cmd/vtunnel/ -o vtunnel

      - name: Build server
        run: v cmd/server/ -o vtunnel-server

      - name: Build client
        run: v cmd/client/ -o vtunnel-client

      - name: Run tests
        run: v test src/
